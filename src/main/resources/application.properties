# =====================================================================
# Spartan Club Central settings
#
# NO REAL PASSWORDS IN THIS FILE: the repository is public.
# Secrets come from environment variables (see docs/run-locally.md).
# The ${NAME:default} form uses the default when the variable is not set.
# =====================================================================
spring.application.name=spartan-club-central

# --- Database (MySQL on this laptop) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club_central}
spring.datasource.username=${DB_USER:club_app}
# Never put the real password here. If DB_PASSWORD is not set, startup fails with
# "Access denied for user 'club_app' (using password: NO)".
spring.datasource.password=${DB_PASSWORD:}

# Hibernate only CHECKS that the tables match the entities. It never creates
# or changes tables; database/schema.sql does that.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Email (Mailpit catches every email at http://localhost:8025) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:no-reply@clubcentral.local}
# Give up quickly if the mail server is down, so a student never waits long.
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# --- App ---
# Used to build password reset links. Change to http://<laptop-IP>:8080 for phone demos.
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Seeded administrator (Phase 4). Leave unset to skip.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Club pictures (FR-15) ---
# Uploaded pictures are stored here, outside the code (keep it out of Git).
app.upload-dir=${UPLOAD_DIR:./uploads}
# The real limit (2 MB) is checked by ClubImageService with a friendly message;
# these higher limits only stop absurd uploads before they reach the app.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=12MB

# --- Sessions (SPR-07) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Errors: never show stack traces or SQL to users (SPR-06) ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
