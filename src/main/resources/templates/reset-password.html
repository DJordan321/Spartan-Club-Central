<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Choose a new password')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<!--/*
  FR-11. Reached from the emailed link (?token=...). The token is checked
  again when the form is sent; passwords are never filled back in (SPR-02).
*/-->
<main id="main" class="container page auth-page">
  <div class="card auth-card">
    <th:block th:unless="${valid}">
      <h1>This link doesn't work</h1>
      <p class="notice notice-error" role="alert">This reset link has expired or was already used.</p>
      <p>Reset links work once, for 30 minutes. You can ask for a new one.</p>
      <p><a class="button" th:href="@{/forgot-password}">Get a new link</a></p>
    </th:block>

    <th:block th:if="${valid}">
      <h1>Choose a new password</h1>
      <div class="error-summary" role="alert" th:if="${!#maps.isEmpty(errors)}" tabindex="-1" id="error-summary">
        <h2>Please fix the following:</h2>
        <ul>
          <li th:each="e : ${errors}"><a th:href="'#' + ${e.key}" th:text="${e.value}">Too short.</a></li>
        </ul>
      </div>
      <form class="stack-form" method="post" novalidate th:action="@{/reset-password}">
        <input type="hidden" name="token" th:value="${token}">
        <div class="field" th:classappend="${errors.containsKey('password')} ? 'has-error'">
          <label for="password">New password</label>
          <p class="field-hint" id="password-hint">8 to 72 characters.</p>
          <p class="field-error" id="password-error" th:if="${errors.containsKey('password')}" th:text="${errors.get('password')}">Too short.</p>
          <input id="password" name="password" type="password" maxlength="72" autocomplete="new-password" required autofocus
                 th:attr="aria-invalid=${errors.containsKey('password')},aria-describedby=${errors.containsKey('password')} ? 'password-hint password-error' : 'password-hint'">
        </div>
        <div class="field" th:classappend="${errors.containsKey('confirmPassword')} ? 'has-error'">
          <label for="confirmPassword">Confirm new password</label>
          <p class="field-error" id="confirmPassword-error" th:if="${errors.containsKey('confirmPassword')}" th:text="${errors.get('confirmPassword')}">Don't match.</p>
          <input id="confirmPassword" name="confirmPassword" type="password" maxlength="72" autocomplete="new-password" required
                 th:attr="aria-invalid=${errors.containsKey('confirmPassword')},aria-describedby=${errors.containsKey('confirmPassword')} ? 'confirmPassword-error' : null">
        </div>
        <button type="submit" class="button">Save new password</button>
      </form>
    </th:block>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
