<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leader login')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<!--
  Leader / administrator login (FR-04). The form posts to /login, which
  Spring Security handles: it checks the BCrypt hash, gives the browser a new
  session ID, and sends leaders to /dashboard and admins to /admin.
  Every failure shows the same message, so the page can't reveal which
  emails have accounts (SPR-06).
-->
<main id="main" class="container page auth-page">
  <div class="card auth-card">
    <h1>Club leader login</h1>
    <p class="muted">Students don't need an account: <a th:href="@{/clubs}">browse clubs</a> and use the form on any club page.</p>

    <p class="notice notice-error" role="alert" th:if="${param.error != null}">Invalid email or password.</p>
    <p class="notice notice-ok" role="status" th:if="${param.registered != null}">Your account was created. Log in to continue.</p>
    <p class="notice notice-ok" role="status" th:if="${param.logout != null}">You've been logged out.</p>

    <form class="stack-form" method="post" th:action="@{/login}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" maxlength="72" autocomplete="current-password" required>
      </div>
      <button type="submit" class="button">Log in</button>
    </form>

    <p class="auth-switch">Lead a club and don't have an account? <a th:href="@{/register}">Create a leader account</a></p>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
