# Test settings: every automated test uses an in-memory H2 database in MySQL
# mode, so tests never touch your real MySQL data and need no setup.
# (MySqlSampleDataTest is the exception: it is opt-in, see that class.)
spring.datasource.url=jdbc:h2:mem:clubcentral;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Tests build the tables from the entities. The real app uses schema.sql + validate.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=no-reply@clubcentral.local
app.base-url=http://localhost:8080
app.admin.email=
app.admin.password=
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
app.upload-dir=${java.io.tmpdir}/spartan-club-central-test-uploads
