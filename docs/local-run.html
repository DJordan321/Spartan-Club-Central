<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spartan Club Central: Phase 2 Preview and Local Run</title>
<style>
/* ===== The app's real stylesheet (src/main/resources/static/css/main.css) ===== */
/* =====================================================================
   Spartan Club Central styles.
   Mobile-first; no external fonts or CDNs so the demo works offline.
   Colors meet WCAG 2.1 AA contrast (NFR-06):
     green #00573F on white      9.6:1
     body text #1F2933 on #F7F8F6 14:1
     muted #4A5560 on white       7.6:1
     black on gold #F2B705       11:1
   Works from 320px to 1920px wide with no sideways scrolling (NFR-08).
   ===================================================================== */
:root {
  --green: #00573F;
  --green-dark: #003D2C;
  --green-tint: #E6F0EC;
  --gold: #F2B705;
  --text: #1F2933;
  --muted: #4A5560;
  --bg: #F7F8F6;
  --card: #FFFFFF;
  --border: #D5DAD7;
  --input-border: #8A949C;
  --radius: 10px;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

main { flex: 1; }

.container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.page { padding-top: 24px; padding-bottom: 48px; }
.narrow { max-width: 680px; }

a { color: var(--green); }
a:hover { color: var(--green-dark); }

/* ---------- Accessibility helpers ---------- */
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 10;
  background: var(--gold); color: #000; padding: 8px 12px; font-weight: 600;
}
.skip-link:focus { left: 8px; top: 8px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Header and footer ---------- */
.site-header { background: var(--green); color: #fff; border-bottom: 4px solid var(--gold); }
.header-inner {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 4px 16px; padding-top: 12px; padding-bottom: 12px;
}
.site-name { color: #fff; font-size: 1.2rem; font-weight: 700; text-decoration: none; }
.site-name:hover { color: #fff; text-decoration: underline; }
.nav-links { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; flex-wrap: wrap; }
.nav-links a {
  display: inline-block; color: #fff; text-decoration: none; font-weight: 600;
  padding: 8px 10px; border-radius: 6px;
}
.nav-links a:hover { background: var(--green-dark); color: #fff; }

.site-footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem; padding: 16px 0; background: var(--card); }
.site-footer p { margin: 0; }

/* ---------- Typography ---------- */
h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 12px; color: var(--green-dark); }
h2 { font-size: 1.2rem; line-height: 1.3; margin: 0 0 10px; color: var(--green-dark); }
p { margin: 0 0 12px; }

/* ---------- Buttons and form controls ---------- */
.button {
  display: inline-block; font: inherit; font-weight: 600; cursor: pointer; text-align: center;
  background: var(--green); color: #fff; border: 0; border-radius: 8px;
  padding: 11px 20px; text-decoration: none; min-height: 44px;
}
.button:hover { background: var(--green-dark); color: #fff; }
.button-gold { background: var(--gold); color: #000; }
.button-gold:hover { background: #FFCB2E; color: #000; }

label { font-weight: 600; }
input, select {
  font: inherit; color: var(--text); background: #fff; width: 100%; min-height: 44px;
  padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 8px;
}

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }

/* ---------- Homepage ---------- */
.hero { background: var(--green-dark); color: #fff; padding: 40px 0 44px; }
.hero h1 { color: #fff; font-size: 2rem; }
.hero-lead { font-size: 1.1rem; max-width: 40ch; color: #E3EEE9; }
.hero-search { display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin-top: 18px; }
.hero-search input { border-color: transparent; }

#browse-heading { margin-top: 32px; font-size: 1.35rem; }
.category-grid {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: 1fr; gap: 12px;
}
.category-card {
  display: flex; flex-direction: column; gap: 2px; height: 100%;
  background: var(--card); border: 1px solid var(--border); border-left: 6px solid var(--green);
  border-radius: var(--radius); padding: 18px; text-decoration: none; color: var(--text);
}
.category-card:hover { border-color: var(--green); background: var(--green-tint); color: var(--text); }
.category-name { font-size: 1.2rem; font-weight: 700; color: var(--green-dark); }
.category-count { color: var(--muted); }
.all-link { margin: 18px 0 48px; font-weight: 600; }

/* ---------- Directory ---------- */
.search-form { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.result-summary { margin: 18px 0 14px; }
.clear-link { margin-left: 10px; white-space: nowrap; }

.club-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 14px; }
.club-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
}
.club-card h2 { margin: 0; font-size: 1.15rem; }
.club-card h2 a { text-decoration: none; }
.club-card h2 a:hover { text-decoration: underline; }
.club-card p { margin: 0; }
.meta { color: var(--muted); font-size: .95rem; }
.meta-label { font-weight: 600; }

.tag {
  align-self: flex-start; display: inline-block; background: var(--green-tint); color: var(--green-dark);
  font-size: .8rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
  padding: 2px 10px; border-radius: 999px; text-decoration: none;
}
a.tag:hover { background: #D3E6DD; color: var(--green-dark); }

.empty-state h2 { margin-bottom: 6px; }

/* ---------- Club profile ---------- */
.back-link { margin-bottom: 16px; font-weight: 600; }
.back-link a { text-decoration: none; }
.back-link a:hover { text-decoration: underline; }
.profile-header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.profile-header h1 { margin: 0; }
.profile-body { display: grid; grid-template-columns: 1fr; gap: 16px; }
.description { white-space: pre-line; margin: 0; }
.details dl { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.details dt { font-size: .85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.details dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.social-links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.social-links a {
  display: inline-block; padding: 6px 12px; border: 1px solid var(--green); border-radius: 999px;
  text-decoration: none; font-weight: 600;
}
.social-links a:hover { background: var(--green-tint); }
.join-card { margin-top: 16px; border-left: 6px solid var(--gold); }
.join-card p { margin: 0; }

/* ---------- Wider screens ---------- */
@media (min-width: 600px) {
  .hero-search { flex-direction: row; }
  .hero-search input { flex: 1; }
  .category-grid { grid-template-columns: repeat(2, 1fr); }
  .club-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 800px) {
  h1 { font-size: 2.1rem; }
  .hero { padding: 64px 0 68px; }
  .hero h1 { font-size: 2.6rem; }
  .search-form { flex-direction: row; align-items: flex-end; }
  .search-form .field { flex: 1; }
  .search-form .field-wide { flex: 2; }
  .category-grid { grid-template-columns: repeat(4, 1fr); }
  .profile-body { grid-template-columns: 2fr 1fr; align-items: start; }
}

@media (min-width: 1000px) {
  .club-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ---------- Join request form (Phase 3) ---------- */
.join-form { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; max-width: 640px; }
.join-card > p { margin: 0; }
textarea {
  font: inherit; color: var(--text); background: #fff; width: 100%; min-height: 120px; resize: vertical;
  padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 8px;
}
.field-hint { margin: 0; color: var(--muted); font-size: .9rem; }
.field-error { margin: 0; color: #A4161A; font-weight: 600; font-size: .95rem; }
.field-error::before { content: "\26A0\FE0E  "; }
.has-error input, .has-error textarea { border: 2px solid #A4161A; }
.join-form .button { align-self: flex-start; }
.error-summary {
  margin-top: 16px; border: 2px solid #A4161A; border-radius: 8px; padding: 12px 16px; background: #FDF0F0;
}
.error-summary h3 { margin: 0 0 6px; font-size: 1rem; color: #A4161A; }
.error-summary ul { margin: 0; padding-left: 20px; }
.error-summary a { color: #A4161A; font-weight: 600; }

/* ---------- Request sent ---------- */
.success-card { border-left: 6px solid var(--green); text-align: left; }
.success-icon {
  width: 44px; height: 44px; border-radius: 50%; background: var(--green); color: #fff;
  display: grid; place-items: center; font-size: 1.4rem; font-weight: 700; margin: 0 0 10px;
}
.muted { color: var(--muted); }
.next-links { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 20px; }

/* ---------- Login state in the header (Phase 4) ---------- */
.nav-links { align-items: center; }
.logout-form { margin: 0; }
.nav-button {
  font: inherit; font-weight: 600; color: #fff; background: transparent; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, .7); border-radius: 6px; padding: 7px 10px; min-height: 40px;
}
.nav-button:hover { background: var(--green-dark); }

/* ---------- Login and registration ---------- */
.auth-page { max-width: 560px; }
.auth-card h1 { font-size: 1.7rem; }
.stack-form { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.stack-form .button { align-self: flex-start; }
.auth-switch { margin: 20px 0 0; }
.optional { font-weight: 400; color: var(--muted); }
.notice { border-radius: 8px; padding: 10px 14px; margin: 12px 0 0; font-weight: 600; }
.notice-error { background: #FDF0F0; border: 2px solid #A4161A; color: #A4161A; }
.notice-ok { background: var(--green-tint); border: 1px solid var(--green); color: var(--green-dark); }
.error-summary h2 { margin: 0 0 6px; font-size: 1rem; color: #A4161A; }

/* ---------- Dashboard ---------- */
.dash-card { margin-top: 16px; }
.dash-card p:last-child { margin-bottom: 0; }
.account-list { margin: 0 0 12px; display: grid; gap: 10px; }
.account-list dt { font-size: .85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.account-list dd { margin: 2px 0 0; overflow-wrap: anywhere; }


/* ===== Extra styles for this offline file only ===== */
.preview-bar { background: #FFF6D6; border-bottom: 1px solid #E3B800; color: #1F2933; font-size: .9rem; }
.preview-bar .container { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding-top: 8px; padding-bottom: 8px; }
.preview-bar p { margin: 0; }
.preview-bar nav { display: flex; gap: 6px; flex-wrap: wrap; }
.preview-bar a { font-weight: 700; color: #003D2C; padding: 4px 10px; border-radius: 999px; border: 1px solid #003D2C; text-decoration: none; background: #fff; }
.preview-bar a[aria-current="page"] { background: #003D2C; color: #fff; }
.test-panel { margin-top: 28px; border-left: 6px solid var(--gold); }
.test-panel ul { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.test-panel a { display: inline-block; padding: 6px 10px; border: 1px solid var(--green); border-radius: 999px; text-decoration: none; font-size: .9rem; }
.test-panel a:hover { background: var(--green-tint); }
.guide li, .guide p { overflow-wrap: anywhere; }
.guide h3 { font-size: 1rem; margin: 0 0 6px; }
.guide .card { margin: 16px 0; }
ol.steps { padding-left: 0; list-style: none; margin: 0; }
ol.steps > li { position: relative; padding: 0 0 18px 44px; }
ol.steps > li > .num { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
  background: var(--green); color: #fff; font-weight: 700; display: grid; place-items: center; }
.os-tabs { display: flex; gap: 6px; margin: 4px 0 6px; flex-wrap: wrap; }
.os-tabs button { font: inherit; cursor: pointer; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--green); background: #fff; color: var(--green-dark); min-height: 40px; }
.os-tabs button[aria-pressed="true"] { background: var(--green); color: #fff; }
.code { position: relative; margin: 8px 0; }
.code pre { margin: 0; background: #1E2A26; color: #E8F1EC; padding: 12px 74px 12px 14px; border-radius: 8px;
  overflow-x: auto; font: .9rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.code button { position: absolute; top: 8px; right: 8px; font: inherit; font-size: .8rem; cursor: pointer; padding: 3px 10px;
  border-radius: 6px; border: 1px solid #4A5A54; background: #2A3833; color: #fff; }
code.inline { background: var(--green-tint); padding: 1px 5px; border-radius: 4px; font-size: .9em; overflow-wrap: anywhere; }
.trouble-wrap { overflow-x: auto; }
.trouble { border-collapse: collapse; width: 100%; min-width: 540px; font-size: .95rem; }
.trouble th, .trouble td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid var(--border); }
.trouble thead th { background: var(--green-tint); color: var(--green-dark); }
.checklist li { margin-bottom: 6px; }
.mail-toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 12px 0 18px; }
.mail-toolbar label { font-weight: 600; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.mail-toolbar input[type=checkbox] { width: 20px; height: 20px; min-height: 0; }
.button-outline { background: #fff; color: var(--green-dark); border: 1px solid var(--green); }
.button-outline:hover { background: var(--green-tint); color: var(--green-dark); }
.mail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.mail { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.mail-head { background: #2C3E50; color: #fff; padding: 12px 16px; }
.mail-head h2 { color: #fff; font-size: 1.05rem; margin: 0 0 6px; }
.mail-head dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .9rem; }
.mail-head dt { color: #C9D3DC; }
.mail-head dd { margin: 0; overflow-wrap: anywhere; }
.mail pre { margin: 0; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font: .92rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.status { display: inline-block; font-size: .8rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.status-DELIVERED { background: var(--green-tint); color: var(--green-dark); }
.status-FAILED { background: #FDF0F0; color: #A4161A; }
.db-wrap { overflow-x: auto; }
.db-table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: .95rem; }
.db-table th, .db-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.db-table thead th { background: var(--green-tint); color: var(--green-dark); }
.fill-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.fill-buttons button { font: inherit; font-size: .9rem; cursor: pointer; padding: 6px 10px; border: 1px solid var(--green); border-radius: 999px; background: #fff; color: var(--green-dark); }
.demo-creds { background: #FFF6D6; border: 1px solid #E3B800; border-radius: 8px; padding: 10px 14px; margin-top: 16px; }
.demo-creds p { margin: 0 0 6px; }
.demo-creds code { background: #fff; }
.hash { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
</style>
</head>

<!-- ===================== Run guide (shown at #/guide) ===================== -->
<template id="guide-template">
  <div class="container page guide">
    <h1>Run the real app on your laptop</h1>
    <p>About 20 minutes the first time, then one command each time after. You'll end up at
      <strong>http://localhost:8080</strong> with these same pages reading live data from MySQL.</p>
    <div class="os-tabs" role="group" aria-label="Choose your computer">
      <button type="button" data-os="win" aria-pressed="true">Windows</button>
      <button type="button" data-os="mac" aria-pressed="false">Mac</button>
    </div>

    <section class="card">
      <h2>First-time setup</h2>
      <ol class="steps">
        <li><span class="num" aria-hidden="true">1</span>
          <h3>Install the tools</h3>
          <ul>
            <li><strong>Java 17 or newer</strong>: Eclipse Temurin from adoptium.net. Check with <code class="inline">java -version</code>.</li>
            <li><strong>MySQL 8 Community Server</strong> from dev.mysql.com/downloads. Write down the <strong>root password</strong>.
              <span data-show="win">Also install <strong>MySQL Workbench</strong> (included in the Windows installer).</span>
              <span data-show="mac">Or with Homebrew: <code class="inline">brew install mysql</code> then <code class="inline">brew services start mysql</code>.</span></li>
            <li><strong>Git</strong> (git-scm.com) and an editor: IntelliJ IDEA Community or VS Code.</li>
            <li><strong>Mailpit</strong> (new in Phase 3), a fake email inbox so nothing real is ever sent.
              <span data-show="win">Download the Windows zip from github.com/axllent/mailpit/releases (the file ending in
                <code class="inline">windows-amd64.zip</code>), unzip it, and keep <code class="inline">mailpit.exe</code> somewhere easy, like your Downloads folder.</span>
              <span data-show="mac">Install it with <code class="inline">brew install mailpit</code>.</span></li>
          </ul>
        </li>
        <li><span class="num" aria-hidden="true">2</span>
          <h3>Download the project (Phase 2 branch)</h3>
          <p data-show="win">In PowerShell:</p><p data-show="mac">In Terminal:</p>
          <div class="code"><pre>git clone https://github.com/DJordan321/Spartan-Club-Central.git</pre><button type="button">Copy</button></div>
          <div class="code"><pre>cd Spartan-Club-Central</pre><button type="button">Copy</button></div>
          <div class="code"><pre>git checkout phase-4-authentication</pre><button type="button">Copy</button></div>
          <p>Already cloned it for Phase 1? Run these two instead:</p>
          <div class="code"><pre>git fetch origin</pre><button type="button">Copy</button></div>
          <div class="code"><pre>git checkout phase-4-authentication</pre><button type="button">Copy</button></div>
        </li>
        <li><span class="num" aria-hidden="true">3</span>
          <h3>Create the database and load the 32 sample clubs</h3>
          <p>Skip this if you already did it for Phase 1: Phase 2 uses the same database.</p>
          <div data-show="win">
            <p>Open <strong>MySQL Workbench</strong>, connect as root, then for each file choose
              <em>File &rarr; Open SQL Script</em> and click the lightning bolt:
              <code class="inline">database\schema.sql</code>, then <code class="inline">database\sample-data.sql</code>.</p>
          </div>
          <div data-show="mac">
            <div class="code"><pre>mysql -u root -p &lt; database/schema.sql</pre><button type="button">Copy</button></div>
            <div class="code"><pre>mysql -u root -p club_central &lt; database/sample-data.sql</pre><button type="button">Copy</button></div>
          </div>
        </li>
        <li><span class="num" aria-hidden="true">4</span>
          <h3>Create the app's database user (also only once)</h3>
          <p>Replace <code class="inline">pick-a-local-password</code> here <em>and</em> in step 5. Run as root
            (a Workbench query tab, or <code class="inline">mysql -u root -p</code>):</p>
          <div class="code"><pre>CREATE USER 'club_app'@'localhost' IDENTIFIED BY 'pick-a-local-password';
GRANT SELECT, INSERT, UPDATE, DELETE ON club_central.* TO 'club_app'@'localhost';</pre><button type="button">Copy</button></div>
        </li>
      </ol>
    </section>

    <section class="card">
      <h2>Every time you run it</h2>
      <ol class="steps">
        <li><span class="num" aria-hidden="true">5</span>
          <h3>Start Mailpit in its own window and leave it running</h3>
          <div data-show="win"><p>Double-click <code class="inline">mailpit.exe</code>, or in PowerShell from the folder it's in:</p>
            <div class="code"><pre>.\mailpit.exe</pre><button type="button">Copy</button></div></div>
          <div data-show="mac"><div class="code"><pre>mailpit</pre><button type="button">Copy</button></div></div>
          <p>Its inbox is at <a href="http://localhost:8025" target="_blank" rel="noopener">http://localhost:8025</a>.
            Skipping Mailpit is OK: requests are still saved, just marked <code class="inline">FAILED</code>.</p>
        </li>
        <li><span class="num" aria-hidden="true">6</span>
          <h3>Start the app with your passwords</h3>

// ---- Same rules as ClubService + ClubRepository.search in the Java app ----
function normalizeKeyword(raw) { const kw = (raw || "").trim(); return kw === "" ? null : kw.slice(0, 100); }
function search(rawKeyword, categoryId) {
  const kw = normalizeKeyword(rawKeyword); const k = kw && kw.toLowerCase();
  return CLUBS.filter(c => c.active)
    .filter(c => k === null || c.name.toLowerCase().includes(k) || c.description.toLowerCase().includes(k))
    .filter(c => categoryId == null || c.categoryId === categoryId)
    .sort((a, b) => a.name.localeCompare(b.name));
}
function getActiveClub(id) { return CLUBS.find(c => c.id === id && c.active) || null; }

// ---- Phase 3: what MySQL + Mailpit would hold, kept for this browser tab only ----
const STATE_KEY = "scc-preview";
const state = (() => {
  const fresh = { requests: [], emails: [], mailDown: false, leaders: [], admin: null, session: null, saved: null, audit: [] };
  try { const saved = JSON.parse(sessionStorage.getItem(STATE_KEY)); if (saved && Array.isArray(saved.requests)) return Object.assign(fresh, saved); } catch (e) {}
  return fresh;
})();
function saveState() { try { sessionStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {} updateMailCount(); }
function updateMailCount() { const n = state.emails.length; document.getElementById("mail-count").textContent = n ? "(" + n + ")" : ""; }

// Same rules and messages as RequestValidator.java
const isEmail = e => e.length <= 254 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
function validateJoin(f) {
  const errors = {}; const name = f.name.trim(), email = f.email.trim(), message = f.message.trim();
  if (!name) errors.name = "Enter your name.";
  else if (name.length > 100) errors.name = "Name must be 100 characters or fewer.";
  if (!email) errors.email = "Enter your email address.";
  else if (!isEmail(email)) errors.email = "Enter a valid email address, like name@example.com.";
  if (!message) errors.message = "Enter a message for the club.";
  else if (message.length > 1000) errors.message = "Message must be 1,000 characters or fewer (yours is " + message.length.toLocaleString("en-US") + ").";
  return errors;
}

// Same order as RequestService.submit: validate, save SUBMITTED, email, save DELIVERED/FAILED
function submitJoin(club, f) {
  const req = { id: state.requests.length + 1, clubId: club.id, clubName: club.name, name: f.name.trim(),
    email: f.email.trim(), message: f.message.trim(), status: "SUBMITTED", date: new Date().toLocaleString("en-US") };
  state.requests.push(req);
  if (state.mailDown) { req.status = "FAILED"; }
  else {
    state.emails.unshift({ from: "no-reply@clubcentral.local", to: club.contactEmail, replyTo: req.email,
      subject: "New join request for " + club.name, date: req.date,
      body: "Hello " + club.name + ",\n\nA student sent a join/contact request through Spartan Club Central.\n\n"
        + "Name:  " + req.name + "\nEmail: " + req.email + "\n\nMessage:\n" + req.message
        + "\n\nReply to this email to answer the student directly.\n\nSpartan Club Central\n" });
    req.status = "DELIVERED";
  }
  saveState();
}

function h(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v != null && v !== false) e.setAttribute(k, v === true ? "" : v); }
  for (const c of children.flat()) { if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}

const SESSION_MINUTES = 30;

// The real app stores a BCrypt hash ($2a$12$...). This offline preview uses a
// salted SHA-256 hash from the browser instead. Either way, no plain passwords.
function randomHex(bytes) { const a = new Uint8Array(bytes); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, "0")).join(""); }
async function previewHash(password, salt) {
  salt = salt || randomHex(8);
  const data = new TextEncoder().encode(salt + ":" + password);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", data);
    return "sha256$" + salt + "$" + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  let h1 = 0x811c9dc5; for (const b of data) { h1 ^= b; h1 = Math.imul(h1, 0x01000193) >>> 0; }   // fallback only
  return "fnv$" + salt + "$" + h1.toString(16);
}
async function checkPassword(password, stored) { return (await previewHash(password, stored.split("$")[1])) === stored; }
async function ensureAdmin() {
  if (!state.admin) {
    state.admin = { id: 1, name: "Administrator", email: DEMO_ADMIN.email, hash: await previewHash(DEMO_ADMIN.password) };
    audit("ADMIN", 1, "ADMIN_SEEDED", true);

  }
  if (!state.leaders.some(l => l.email === DEMO_LEADER.email)) {      // like running with SPRING_PROFILES_ACTIVE=demo
    const id = state.leaders.length + 1;

}

const normEmail = e => (e || "").trim().toLowerCase();
const utf8Length = s => new TextEncoder().encode(s).length;
function isEmailTaken(email) { const e = normEmail(email); return state.leaders.some(l => l.email === e) || (state.admin && state.admin.email === e); }

function currentUser() {
  const sess = state.session;
  if (!sess) return null;
  if (Date.now() - sess.lastActive > SESSION_MINUTES * 60000) { state.session = null; saveState(); return null; }   // SPR-07
  sess.lastActive = Date.now(); saveState();
  if (sess.role === "ADMIN") return { id: state.admin.id, name: state.admin.name, role: "ADMIN" };
  const l = state.leaders.find(x => x.id === sess.id);

function validateRegistration(f) {
  const e = {}; const name = f.name.trim(), email = f.email.trim(), position = f.position.trim();
  if (!name) e.name = "Enter your name."; else if (name.length > 100) e.name = "Name must be 100 characters or fewer.";
  if (!email) e.email = "Enter your email address."; else if (!isEmail(email)) e.email = "Enter a valid email address, like name@example.com.";
  if (position.length > 50) e.position = "Position must be 50 characters or fewer.";
  if (!f.password) e.password = "Choose a password.";
  else if (f.password.length < 8) e.password = "Password must be at least 8 characters.";
  else if (utf8Length(f.password) > 72) e.password = "Password must be 72 characters or fewer.";
  if (!e.password && f.password !== f.confirmPassword) e.confirmPassword = "The two passwords don't match.";
  return e;
}

    { requests: [], emails: [], mailDown: false, leaders: [], admin: null, session: null, saved: null, audit: [] }); await ensureAdmin(); render(); });

    h("section", { class: "card", style: "margin-top:16px", "aria-labelledby": "leaders-heading" },

// ---- Router ----
function render() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [hash, anchor] = raw.split("#");   // e.g. #/clubs/1#join
  const [path, query] = hash.split("?");
  const params = new URLSearchParams(query || "");
  let page, isGuide = false;
  const u = currentUser();
  renderNav(u);
  const needs = role => {                       // like SecurityConfig: protected areas
    if (!u) { state.saved = path; saveState(); location.replace("#/login"); return null; }
    return u.role === role ? u : false;
  };
  if (path === "/dashboard" || path.startsWith("/dashboard/")) {
    const ok = needs("LEADER"); if (ok === null) return;
    page = ok ? dashboardPage(ok) : forbiddenPage();
  } else if (path === "/admin" || path.startsWith("/admin/")) {
    const ok = needs("ADMIN"); if (ok === null) return;
    page = ok ? adminPage(ok) : forbiddenPage();
  } else if ((path === "/login" || path === "/register") && u) { location.replace("#" + homeFor(u)); return; }
  else if (path === "/login") page = loginPage(params);
  else if (path === "/register") page = registerPage();
  else if (path === "/" ) page = homePage();
  else if (path === "/clubs") page = directoryPage(params);
  else if (/^\/clubs\/\d+$/.test(path)) page = profilePage(Number(path.split("/")[2]));
  else if (/^\/clubs\/\d+\/requests\/sent$/.test(path)) page = sentPage(Number(path.split("/")[2]));
  else if (path === "/mailpit") page = inboxPage();
  else if (path === "/guide") { page = guidePage(); isGuide = true; }
  else page = notFoundPage();
  const main = document.getElementById("main");
  main.replaceChildren(...[].concat(page));
  const navs = { preview: "nav-preview", mail: "nav-mail", guide: "nav-guide" };
  Object.values(navs).forEach(n => document.getElementById(n).removeAttribute("aria-current"));
  document.getElementById(isGuide ? navs.guide : path === "/mailpit" ? navs.mail : navs.preview).setAttribute("aria-current", "page");
  if (isGuide) selectOs(savedOs());
  const target = anchor && document.getElementById(anchor);
  if (target) target.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
}

function savedOs() {
  try { const s = localStorage.getItem("scc-os"); if (s) return s; } catch (e) {}
  return /Mac|iPhone|iPad/.test(navigator.platform) ? "mac" : "win";
}
function selectOs(os) {
  document.querySelectorAll(".os-tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.os === os));
  document.querySelectorAll("[data-show]").forEach(n => n.hidden = n.dataset.show !== os);
  try { localStorage.setItem("scc-os", os); } catch (e) {}
}
async function copy(b) {
  const text = b.previousElementSibling.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); } catch (e2) {} t.remove(); }
  b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500);
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-focus]");
  if (a) { e.preventDefault(); const f = document.getElementById(a.dataset.focus); if (f) { f.scrollIntoView({ block: "center" }); f.focus(); } }
});
updateMailCount();
window.addEventListener("hashchange", render);
ensureAdmin().then(render);
</script>
